name: NewsAxis CI & Deployment Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm test

      - name: Build Production Assets with GitHub Secrets
        run: npm run build
        env:
          VITE_APPWRITE_ENDPOINT: ${{ secrets.VITE_APPWRITE_ENDPOINT || 'https://cloud.appwrite.io/v1' }}
          VITE_APPWRITE_PROJECT_ID: ${{ secrets.VITE_APPWRITE_PROJECT_ID || 'newsaxis-prod' }}
          VITE_APPWRITE_DATABASE_ID: ${{ secrets.VITE_APPWRITE_DATABASE_ID || 'newsaxis-main' }}
          VITE_APPWRITE_BUCKET_ID: ${{ secrets.VITE_APPWRITE_BUCKET_ID || 'newsaxis-media' }}
          VITE_GNEWS_API_KEY: ${{ secrets.VITE_GNEWS_API_KEY }}
          VITE_NEWSDATA_API_KEY: ${{ secrets.VITE_NEWSDATA_API_KEY }}
          VITE_NEWSAPI_KEY: ${{ secrets.VITE_NEWSAPI_KEY }}
          VITE_MEDIASTACK_API_KEY: ${{ secrets.VITE_MEDIASTACK_API_KEY }}
          VITE_THENEWSAPI_KEY: ${{ secrets.VITE_THENEWSAPI_KEY }}
          VITE_USE_DEMO_DATA: ${{ secrets.VITE_USE_DEMO_DATA || 'false' }}
